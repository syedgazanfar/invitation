server {
    listen 80;
    server_name localhost;
    
    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # API proxy
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Admin panel
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Static and media files
    location /static/ {
        alias /var/www/static/;
    }
    
    location /media/ {
        alias /var/www/media/;
    }
}

# WA-AKG WhatsApp gateway dashboard, on its own subdomain of the same server.
# (WA-AKG is a Next.js app without a basePath, so it needs its own host, not a sub-path.)
# Set WA_BASE_URL=https://wa.example.com in .env so its login callbacks match.
server {
    listen 80;
    server_name wa.example.com;   # <-- change to your subdomain

    client_max_body_size 50m;     # media uploads

    location / {
        proxy_pass http://wa-gateway:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;     # Socket.IO / websockets
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
